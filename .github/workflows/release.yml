name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.4.0)'
        required: false
        default: 'v0.4.0'

permissions:
  contents: write
  packages: write

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel pkgconf git cargo rust gettext gtk4 libadwaita flatpak appstream openssl sudo zstd

      - name: Compile translation catalogs
        run: |
          if [ -f po/LINGUAS ]; then
            while read -r lang; do
              [ -z "$lang" ] && continue
              if [ -f "po/${lang}.po" ]; then
                msgfmt -c "po/${lang}.po" -o "po/${lang}.mo"
              fi
            done < po/LINGUAS
          fi

      - name: Build release binary
        run: |
          cargo build --release -p pastor-ui

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ inputs.version || 'v0.4.0' }}"
          fi
          VERSION="${TAG_NAME#v}"
          chmod +x .github/scripts/package_arch.sh
          .github/scripts/package_arch.sh x86_64 "$VERSION"

      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pastor-x86_64
          path: pastor-*-x86_64.pkg.tar.zst

  build-aarch64:
    name: Build aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package on Arch Linux ARM
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: archarm_latest
          githubToken: ${{ github.token }}
          install: |
            sed -i 's/^[[:space:]]*CheckSpace/#CheckSpace/' /etc/pacman.conf || true
            pacman -Syu --noconfirm --needed base-devel pkgconf git cargo rust gettext gtk4 libadwaita flatpak appstream openssl sudo zstd
          run: |
            TAG_NAME="${{ github.ref_name }}"
            if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
              TAG_NAME="${{ inputs.version || 'v0.4.0' }}"
            fi
            VERSION="${TAG_NAME#v}"

            if [ -f po/LINGUAS ]; then
              while read -r lang; do
                [ -z "$lang" ] && continue
                if [ -f "po/${lang}.po" ]; then
                  msgfmt -c "po/${lang}.po" -o "po/${lang}.mo"
                fi
              done < po/LINGUAS
            fi

            cargo build --release -p pastor-ui

            chmod +x .github/scripts/package_arch.sh
            .github/scripts/package_arch.sh aarch64 "$VERSION"

      - name: Upload aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pastor-aarch64
          path: pastor-*-aarch64.pkg.tar.zst

  release:
    name: Create GitHub Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.pkg.tar.zst" -exec cp {} release_assets/ \;
          cp PKGBUILD release_assets/
          cd release_assets
          sha256sum * > SHA256SUMS
          ls -la

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="${{ inputs.version || 'v0.4.0' }}"
          fi
          VERSION="${TAG_NAME#v}"
          python3 -c "
          import re
          version = '$VERSION'
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = 'Release ' + version
          with open('RELEASE_NOTES.md', 'w') as out:
              out.write(notes + '\n')
          "
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version || 'v0.4.0' }}
          name: Pastor ${{ github.ref_name || inputs.version || 'v0.4.0' }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release_assets/*
