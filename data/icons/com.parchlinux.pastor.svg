<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgTile" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b131e"/>
      <stop offset="1" stop-color="#102535"/>
    </linearGradient>

    <!-- Parch Brand Gradient -->
    <linearGradient id="parchGradient" x1="20" y1="108" x2="108" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF80"/>
      <stop offset="0.25" stop-color="#00FF95"/>
      <stop offset="0.52" stop-color="#00EAFF"/>
      <stop offset="0.76" stop-color="#00A9FF"/>
      <stop offset="1" stop-color="#0080FF"/>
    </linearGradient>

    <!-- Software Bag Surface Gradient -->
    <linearGradient id="bagSurface" x1="64" y1="36" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2a3a"/>
      <stop offset="0.6" stop-color="#121f2d"/>
      <stop offset="1" stop-color="#0c1622"/>
    </linearGradient>

    <!-- Subtle Border Accent -->
    <linearGradient id="borderGlow" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00EAFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#00FF80" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0080FF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="sheen" x1="64" y1="38" x2="64" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="bagShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00EAFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Squircle Canvas Tile -->
  <rect x="4" y="4" width="120" height="120" rx="36" fill="url(#bgTile)" filter="url(#tileShadow)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="35.5" stroke="url(#borderGlow)" stroke-width="1.2"/>

  <!-- Subtle Parch Ambient Glow -->
  <circle cx="64" cy="74" r="32" fill="#00EAFF" fill-opacity="0.07" filter="blur(16px)"/>

  <!-- Bag Handle -->
  <path d="M46 40 C46 22 82 22 82 40" stroke="url(#parchGradient)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="46" cy="40" r="2.5" fill="#00FF80"/>
  <circle cx="82" cy="40" r="2.5" fill="#0080FF"/>

  <!-- Bag Body -->
  <g filter="url(#bagShadow)">
    <path d="M28 38
             L100 38
             C104.5 38 108 41.6 107.5 46.1
             L101.5 98.1
             C101 102.5 97.2 106 92.7 106
             L35.3 106
             C30.8 106 27 102.5 26.5 98.1
             L20.5 46.1
             C20 41.6 23.5 38 28 38 Z"
          fill="url(#bagSurface)"
          stroke="#00EAFF"
          stroke-opacity="0.22"
          stroke-width="1"/>
  </g>

  <!-- Bag Rim Highlight -->
  <path d="M28 39 L100 39" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>

  <!-- Top Gloss Highlight -->
  <path d="M28 38 L100 38 L97 68 C64 64 64 64 31 68 Z" fill="url(#sheen)"/>

  <!-- Official Parch Logo in Center -->
  <g transform="translate(37, 49) scale(0.125)" filter="url(#logoGlow)">
    <path d="M339.114 272.077L264.782 281.663L135.977 356.028C146.62 370.571 159.146 383.685 173.412 394.871C190.119 406.777 210.413 415.457 234.533 416.361C303.015 418.961 341.206 366.341 342.947 307.425C343.306 295.26 341.845 283.547 339.114 272.077Z" fill="#00FF80"/>
    <path d="M149.582 281.663C137.077 295.251 124.522 311.397 118.174 327.001C123.319 337.175 129.281 346.879 135.976 356.028L264.782 281.663H149.582ZM140.971 362.543C141.727 363.493 142.491 364.434 143.264 365.37C142.492 364.434 141.727 363.493 140.971 362.543ZM148.79 371.817C149.342 372.43 149.915 373.023 150.474 373.629C149.915 373.023 149.341 372.43 148.79 371.817ZM155.732 379.116C156.305 379.691 156.869 380.274 157.449 380.842C156.869 380.273 156.304 379.692 155.732 379.116ZM164.228 387.166C164.772 387.65 165.324 388.125 165.873 388.603C165.324 388.125 164.772 387.65 164.228 387.166Z" fill="#0080FF"/>
    <path d="M286.931 167.793L184.657 248.541C184.657 248.541 167.168 262.554 149.583 281.663H264.782L265.582 281.201L327.679 239.13C317.145 215.571 302.325 192.348 286.931 167.793ZM149.583 281.663C145.233 286.389 140.907 291.414 136.808 296.636C140.902 291.427 145.238 286.384 149.583 281.663ZM135.722 298.002C134.869 299.107 134.056 300.225 133.231 301.345C134.056 300.228 134.869 299.105 135.722 298.002ZM130.922 304.524C130.228 305.51 129.562 306.498 128.896 307.491C129.562 306.499 130.228 305.508 130.922 304.524ZM125.579 312.6C125.45 312.812 125.328 313.023 125.2 313.235C125.328 313.023 125.45 312.811 125.579 312.6Z" fill="#00EAFF"/>
    <path d="M128.938 112.079C108.479 144.053 96.5584 181.73 95.0785 220.985C94.1701 246.191 97.6097 270.937 104.85 294.174L184.657 248.541L273.141 178.681L185.68 137.06L128.938 112.079ZM307.666 201.389C308.086 202.097 308.521 202.81 308.938 203.517C308.522 202.81 308.086 202.097 307.666 201.389ZM314.962 214.046C315.529 215.063 316.072 216.078 316.627 217.094C316.073 216.079 315.528 215.062 314.962 214.046ZM320.889 225.13C321.437 226.194 321.988 227.258 322.521 228.323C321.989 227.259 321.436 226.193 320.889 225.13Z" fill="#00A9FF"/>
    <path d="M286.247 21.5678C238.459 22.3028 192.396 41.9963 157.102 77.0381C152.585 81.5225 148.303 86.2253 144.236 91.1046L185.68 137.06L273.14 178.681L286.931 167.793C281.433 159.023 275.877 150.101 270.396 140.908C246.374 100.615 259.218 36.3958 304.612 22.2311C301.688 21.9741 298.758 21.7888 295.825 21.6749C292.626 21.5543 289.432 21.5188 286.247 21.5678ZM300.374 189.346C301.04 190.428 301.706 191.51 302.365 192.589C301.709 191.515 301.037 190.423 300.374 189.346Z" fill="#00FF95"/>
  </g>
</svg>
